workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          cd android
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd android/ios
          pod install
      - name: Build iOS
        script: |
          cd android
          flutter build ios --release --no-codesign
    artifacts:
      - android/build/ios/iphoneos/Runner.app

  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          cd android
          flutter pub get
      - name: Build APK
        script: |
          cd android
          flutter build apk --release
    artifacts:
      - android/build/app/outputs/flutter-apk/app-release.apk
